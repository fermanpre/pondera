# Actualización diaria del promedio de encuestas y publicación de la web en GitHub Pages.
# Se ejecuta cada tres horas (GitHub no garantiza la hora: a veces retrasa o pierde ejecuciones programadas) y a mano (pestaña Actions, botón «Run workflow»). Desde el 24/11/2026 (hora de Madrid) no hace nada: veda de sondeos, art. 69.7 de la LOREG.
name: Actualizar promedio y publicar

on:
  schedule:
    - cron: "17 */3 * * *"   # cada tres horas, al minuto 17 (UTC): los minutos 00 y 30 son los más cargados de GitHub y ahí se retrasan o se pierden ejecuciones programadas
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    outputs:
      veda: ${{ steps.fecha.outputs.veda }}
    steps:
      - id: fecha
        run: |
          hoy=$(TZ=Europe/Madrid date +%Y%m%d)
          if [ "$hoy" -ge 20261124 ]; then
            echo "veda=true" >> "$GITHUB_OUTPUT"
            echo "Veda de sondeos (desde el 24/11/2026): no se actualiza ni se publica nada."
          else
            echo "veda=false" >> "$GITHUB_OUTPUT"
          fi

  actualizar:
    needs: comprobar
    if: needs.comprobar.outputs.veda != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install lxml openpyxl pillow

      - name: Bajar las encuestas nuevas de Wikipedia (solo la próxima elección)
        run: python Sondeos/extraer_sondeos_wikipedia.py --solo-proxima

      - name: Bajar las encuestas regionales y provinciales de Wikipedia
        run: python Sondeos/extraer_sondeos_regionales.py

      - name: Completar las encuestas regionales con las de Electogrāfica (solo las que Wikipedia aún no tiene)
        run: python Sondeos/extraer_electografica.py

      - name: Detectar cifras atípicas (casas con peso recortado)
        run: python Sondeos/detectar_cifras_atipicas.py

      - name: Recalcular la serie diaria del promedio
        run: python Sondeos/serie_promedio_diaria.py

      - name: Actualizar el listado de sondeos con sus fuentes
        run: python Web/exportar_listado_sondeos.py

      - name: Actualizar el listado de sondeos regionales
        run: python Web/exportar_listado_regional.py

      - name: Recalcular la evolución del promedio de cada territorio
        run: python Web/serie_promedio_territorial.py

      - name: Actualizar la previsión con el promedio vivo (objetivos, reparto sin ruido y página Resumen)
        run: python Web/actualizar_prevision_diaria.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Calcular los escaños en juego y el voto útil de cada provincia
        run: node Web/voto_util_provincias.js
      - name: Calcular los datos curiosos de Inicio
        run: node Web/datos_curiosos.js
      - name: Calcular los mundos posibles del Congreso
        run: node Web/mundos_posibles.js
      - name: Calcular los mundos raros del Congreso
        run: node Web/mundos_raros.js

      - name: Precalcular el escenario representativo (10.000 sorteos)
        run: node Web/escenario_representativo.js

      - name: Actualizar la serie de previsión (escaños, mayorías y primera fuerza de cada día)
        run: python Web/serie_prevision_diaria.py --ultimos 3

      - name: Actualizar las encuestas recientes del simulador («Crea tu propio promedio»)
        run: python Web/exportar_encuestas_recientes.py

      - name: Regenerar las páginas del sitio
        run: python Web/generar_sitio.py

      - name: Guardar los cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sondeos/upc_en_encuestas.csv Sondeos/sondeos_wikipedia_largo.csv Sondeos/sondeos_regionales_largo.csv Sondeos/casas_con_cifras_descartadas.csv Web/sitio/serie_promedio.json Web/sitio/serie_promedio.js Web/sitio/encuestas_promedio.json Web/sitio/encuestas_promedio.js Web/sitio/listado_sondeos.json Web/sitio/listado_sondeos.js Web/sitio/listado_regional.json Web/sitio/listado_regional.js Sondeos/promedio_actual.csv Web/sitio Web/plantillas/resumen.html
          if git diff --cached --quiet; then
            echo "Sin cambios hoy."
          else
            git commit -m "Actualizar promedio de encuestas ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web/sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
